version: '3.8'

services:
  # QuickKart Backend Service (Node.js + Express + Socket.IO)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickkart-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=quickkart_jwt_secret_key_2026_super_secure
      - MONGODB_URI=mongodb+srv://itsmeshivam885_db_user:yJXUBuZmvwql8k7h@quickkart1.v7je6oo.mongodb.net/quickkart?retryWrites=true&w=majority&appName=QuickKart1
      - CLIENT_URL=http://localhost:80

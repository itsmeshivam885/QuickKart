version: '3.8'

services:
  # QuickKart Backend Service (Node.js + Express + Socket.IO + Supabase PostgreSQL)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickkart-backend
    restart: always
    environment:
      - PORT=${PORT:-5000}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-quickkart_jwt_secret_key_2026_super_secure}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:80}
    ports:
      - "5000:5000"
    networks:
      - quickkart-network

  # QuickKart Frontend Service (React + Vite + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickkart-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quickkart-network

networks:
  quickkart-network:
    driver: bridge
